name: Feature request
description: Propose a concrete PTK capability or contract change
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and required outcome. Do not include secrets,
        customer data, or private operational evidence.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is blocked, for whom, and how often?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: State observable behavior rather than a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds and why they are insufficient.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and risk
      description: Note affected platforms, clients, public tools, audit data, security boundaries, or install behavior.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: I removed credentials, customer data, and sensitive evidence.
          required: true

