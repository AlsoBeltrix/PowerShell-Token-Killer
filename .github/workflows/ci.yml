name: CI

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # RTK is a required PTK dependency: the server refuses to start without
      # it, so any job that launches the server needs a real rtk on PATH.
      # Upstream's install.sh covers Linux/macOS only; Windows takes the
      # published msvc zip asset.
      - name: Install RTK (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install RTK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'rtk-x86_64-pc-windows-msvc.zip'
          $url = "https://github.com/rtk-ai/rtk/releases/latest/download/$asset"
          $dest = Join-Path $env:USERPROFILE '.local\bin'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $dest | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify RTK
        shell: bash
        run: rtk --version

      # Pester 5 is preinstalled on all three runner images (slice-0 probe);
      # the install is a fallback for runner-image drift.
      - name: Ensure Pester 5
        shell: pwsh
        run: |
          if (-not (Get-Module Pester -ListAvailable | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
          }

      - name: Pester suite
        shell: pwsh
        run: Invoke-Pester -Path tests/PwshTokenCompressor.Tests.ps1 -Output Detailed -CI

      - name: Release selection tests
        shell: pwsh
        run: ./server/test-release-selection.ps1

      - name: Release signing documentation tests
        shell: pwsh
        run: ./server/test-release-signing-docs.ps1

      - name: Notarization recovery tests
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/test-notarize-macos.sh

      - name: Developer ID identity selection tests
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/test-select-developer-id-identity.sh

      - name: Server tests
        run: dotnet test server/PtkMcpServer.slnx

      - name: Stdio handshake
        shell: pwsh
        run: ./server/test-handshake.ps1

  siem:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: SIEM receiver tests
        run: dotnet test siem/PtkSiem.slnx

      - name: Mini-SIEM deployment lifecycle tests
        shell: pwsh
        run: ./siem/test-manage.ps1

      - name: Build and verify the native SIEM package
        shell: pwsh
        run: |
          $rid = [Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          $output = Join-Path $env:RUNNER_TEMP 'ptk-siem-package'
          $sourceCommit = (git rev-parse --short $env:GITHUB_SHA).Trim()
          ./siem/build-package.ps1 -OutputDir $output -Rid $rid -Version 0.0.0-ci
          ./siem/test-verify-package.ps1 -PackageDir $output -Rid $rid `
            -Version 0.0.0-ci -SourceCommit $sourceCommit -SourceRoot $PWD
