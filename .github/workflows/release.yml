name: Release

# Tag-triggered. Builds one artifact per RID on that RID's own native runner
# and assembles a DRAFT release. Publishing is a separate owner action: this
# workflow never publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0-rc.1) when running manually'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each RID builds on matching hardware: PtkWorkerBroker is native and
          # the layout generator refuses cross-RID builds.
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: win-arm64
            os: windows-11-arm
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar
          - rid: osx-arm64
            os: macos-latest
            archive: tar
    runs-on: ${{ matrix.os }}
    # A hung runner should cost minutes, not the six-hour default: rc.3's
    # osx leg signed successfully and then hung inside the smoke test for
    # ~40 minutes until the runner was reaped, with no code change on that
    # platform since its clean pass. Notarization legitimately waits on
    # Apple, so the bound stays generous.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'
          }
          # install.ps1 strips a leading v; keep the tag shape out of the
          # artifact name too.
          $version = $version -replace '^[vV]', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version for ${{ matrix.rid }}"

      # RTK is a required dependency, so the packaged server cannot even start
      # without it and the handshake below would fail. win-arm64 has no
      # upstream aarch64 build and runs the x64 binary under emulation.
      - name: Install RTK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $HOME '.local/bin'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $asset = switch ('${{ matrix.rid }}') {
            'win-x64'     { 'rtk-x86_64-pc-windows-msvc.zip' }
            'win-arm64'   { 'rtk-x86_64-pc-windows-msvc.zip' }
            'linux-x64'   { 'rtk-x86_64-unknown-linux-musl.tar.gz' }
            'linux-arm64' { 'rtk-aarch64-unknown-linux-gnu.tar.gz' }
            'osx-arm64'   { 'rtk-aarch64-apple-darwin.tar.gz' }
          }
          $url = "https://github.com/rtk-ai/rtk/releases/latest/download/$asset"
          $download = Join-Path ([IO.Path]::GetTempPath()) $asset
          Invoke-WebRequest -Uri $url -OutFile $download
          if ($asset.EndsWith('.zip')) {
            Expand-Archive -Path $download -DestinationPath $dest -Force
          } else {
            tar -xzf $download -C $dest
            if ($LASTEXITCODE -ne 0) { throw "tar failed for $asset" }
          }
          $dest >> $env:GITHUB_PATH

      # A version banner only proves the loader started the image. PTK depends
      # on the rewriter answering, which is what actually has to work under
      # win-arm64 emulation.
      - name: Verify RTK answers hook check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rtk --version
          $rewritten = rtk hook check --agent ptk 'git status --short' 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($rewritten)) {
            throw "rtk hook check did not answer on ${{ matrix.rid }} (exit $LASTEXITCODE)"
          }
          Write-Host "rtk rewrote to: $rewritten"

      - name: Build layout
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/install.ps1 `
            -LayoutOnly `
            -OutputDir out/ptk `
            -Rid ${{ matrix.rid }} `
            -Version ${{ steps.version.outputs.version }}

      # The standalone SIEM receiver ships per-RID from these same legs
      # (audit-restoration R6; contract rule 7: it is signed exactly like the
      # server). Published BEFORE the signing steps so they cover its
      # binaries, archived as its own artifact because it is a separately
      # installed product.
      - name: Publish the SIEM receiver
        shell: pwsh
        run: |
          dotnet publish siem/PtkSiemReceiver/PtkSiemReceiver.csproj `
            -c Release -r ${{ matrix.rid }} --self-contained true `
            -o out/ptk-siem
          if ($LASTEXITCODE -ne 0) { throw 'receiver publish failed' }

      # Every Mach-O in the payload is Developer ID-signed with hardened
      # runtime BEFORE any gate runs, so the smoke test and product proof
      # below exercise the exact signed bits that ship — including that the
      # entitlements keep the JITting .NET runtime alive under hardening.
      # The identity lives only in a throwaway keychain; Apple's G2
      # intermediate is imported alongside it because codesign refuses an
      # identity whose chain cannot validate (the exact failure first hit on
      # the dev machine).
      # Every PE binary in the payload is Trusted Signing-signed BEFORE any
      # gate runs, so the smoke test and product proof below exercise the
      # exact signed bits that ship. The action authenticates the
      # github-signing app registration directly with a client secret (no
      # separate OIDC federated-credential step); that registration holds
      # only the Certificate Profile Signer role on the signing account, so
      # a compromised secret cannot do anything beyond sign artifacts. Runs
      # on win-arm64 too: the action is a PowerShell module invocation, no
      # native x64-only tooling, and win-arm64 already runs the x64 RTK
      # binary under emulation without issue.
      # The Trusted Signing dlib is C++/CLI and ships x64/x86 only (no arm64
      # build exists in Microsoft.Trusted.Signing.Client), so on this runner
      # it executes under x64 emulation and needs an x64 .NET runtime the
      # arm64 image does not carry — without one, signtool dies with a bare
      # exit 3 before ever reaching the service. Proved by the rc.3 split:
      # win-x64 signed cleanly with identical credentials while win-arm64
      # failed in two seconds. net8.0, rollForward Major, per the dlib's own
      # runtimeconfig; DOTNET_ROOT_X64 is where an x64 host process on arm64
      # Windows probes for its runtime.
      - name: Install the x64 .NET runtime the signing dlib needs (arm64)
        if: matrix.rid == 'win-arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path ([IO.Path]::GetTempPath()) 'dotnet-install.ps1'
          Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $script
          & $script -Runtime dotnet -Channel 8.0 -Architecture x64 `
            -InstallDir 'C:\Program Files\dotnet\x64'
          "DOTNET_ROOT_X64=C:\Program Files\dotnet\x64" >> $env:GITHUB_ENV

      - name: Sign the Windows payload
        if: startsWith(matrix.rid, 'win-')
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: public-trust
          files-folder: ${{ github.workspace }}\out\ptk\bin
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the Windows SIEM receiver payload
        if: startsWith(matrix.rid, 'win-')
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: public-trust
          files-folder: ${{ github.workspace }}\out\ptk-siem
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign the macOS payload
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "MACOS_CERT_P12_BASE64 secret is missing; macOS release artifacts must be signed" >&2
            exit 1
          fi
          KC="$RUNNER_TEMP/ptk-sign.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          curl -sSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk 'NR==1 {print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "no valid signing identity found in the imported certificate" >&2
            exit 1
          fi
          find out/ptk/bin out/ptk-siem -type f -print0 | while IFS= read -r -d '' f; do
            t=$(file -b "$f")
            case "$t" in
              *Mach-O*executable*)
                codesign --force --sign "$IDENTITY" --timestamp --options runtime \
                  --entitlements server/macos-signing-entitlements.plist "$f" ;;
              *Mach-O*)
                codesign --force --sign "$IDENTITY" --timestamp --options runtime "$f" ;;
            esac
          done
          codesign --verify --strict -v out/ptk/bin/PtkMcpServer
          codesign --verify --strict -v out/ptk-siem/PtkSiemReceiver
          # -dvv, not -dv: the Authority= lines only appear at the second
          # verbosity level, and this grep asserting on absent output failed
          # an otherwise fully successful first signing run.
          codesign -dvv out/ptk/bin/PtkMcpServer 2>&1 | grep "Authority=Developer ID Application"

      - name: Smoke-test the packaged server
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.rid }}'.StartsWith('win-')) {
            'out/ptk/bin/PtkMcpServer.exe'
          } else {
            'out/ptk/bin/PtkMcpServer'
          }
          if (-not $IsWindows) { chmod +x $exe }
          pwsh -NoProfile -File server/test-handshake.ps1 -ServerCommand (Resolve-Path $exe)

      # The handshake proves the transport; this proves the product contract
      # on the exact bits being archived. Slice 7.5 previously required a
      # hand-run pass on one clean host per RID, which meant five machines
      # and a manual checklist. Every RID already builds on its own native
      # runner here, so run the gate where the artifact is made: a release
      # cannot now be drafted from an artifact that fails its own contract.
      #
      # Not the uninstall check: -UninstallHome needs an installed home, and
      # this stage has a layout rather than an install. That leg stays with
      # the operator's per-host pass.
      - name: Prove the product contract on the packaged bits
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.rid }}'.StartsWith('win-')) {
            'out/ptk/bin/PtkMcpServer.exe'
          } else {
            'out/ptk/bin/PtkMcpServer'
          }
          pwsh -NoProfile -File server/direct-product-proof.ps1 `
            -ServerPath (Resolve-Path $exe)

      # The startup gate is a product contract: no RTK means a clear refusal,
      # never a half-working server. Proven against the packaged bits.
      - name: Prove the RTK startup gate
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.rid }}'.StartsWith('win-')) {
            'out/ptk/bin/PtkMcpServer.exe'
          } else {
            'out/ptk/bin/PtkMcpServer'
          }
          # The child needs a genuinely empty environment block. Start-Process
          # -Environment MERGES into the inherited one, so the real PATH
          # survives and the server legitimately finds rtk — a gate that can
          # never fail is not a gate. Clear the block explicitly instead.
          $psi = [Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Resolve-Path $exe)
          $psi.UseShellExecute = $false
          $psi.RedirectStandardError = $true
          $psi.EnvironmentVariables.Clear()
          if ($IsWindows) {
            # Without SystemRoot the loader cannot resolve system DLLs and the
            # process dies before reaching PTK's own startup check.
            $psi.EnvironmentVariables['SystemRoot'] = $env:SystemRoot
          }
          $p = [Diagnostics.Process]::Start($psi)
          $text = $p.StandardError.ReadToEnd()
          if (-not $p.WaitForExit(60000)) {
            $p.Kill($true)
            throw "server did not exit without RTK; it must refuse to start. stderr: $text"
          }
          if ($p.ExitCode -ne 78) {
            throw "expected exit 78 without RTK, got $($p.ExitCode). stderr: $text"
          }
          if ($text -notmatch 'PTK_RTK_PATH') {
            throw "refusal message did not name PTK_RTK_PATH. stderr: $text"
          }
          Write-Host "Startup gate ok: exit 78, message names PTK_RTK_PATH"

      # The receiver's own startup contract on the exact packaged bits: with
      # no configuration it must refuse fast (exit 1) naming PTK_SIEM_CONFIG
      # — proving the binary launches on this RID and fails closed rather
      # than serving unconfigured.
      - name: Smoke-test the packaged SIEM receiver
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.rid }}'.StartsWith('win-')) {
            'out/ptk-siem/PtkSiemReceiver.exe'
          } else {
            'out/ptk-siem/PtkSiemReceiver'
          }
          if (-not $IsWindows) { chmod +x $exe }
          $psi = [Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Resolve-Path $exe)
          $psi.UseShellExecute = $false
          $psi.RedirectStandardError = $true
          $psi.EnvironmentVariables.Remove('PTK_SIEM_CONFIG')
          $p = [Diagnostics.Process]::Start($psi)
          $text = $p.StandardError.ReadToEnd()
          if (-not $p.WaitForExit(60000)) {
            $p.Kill($true)
            throw "receiver did not exit without configuration. stderr: $text"
          }
          if ($p.ExitCode -ne 1 -or $text -notmatch 'PTK_SIEM_CONFIG') {
            throw "expected exit 1 naming PTK_SIEM_CONFIG, got $($p.ExitCode). stderr: $text"
          }
          Write-Host 'Receiver smoke ok: refuses without configuration, names PTK_SIEM_CONFIG'

      # Notarization is Apple's malware-scan-and-ticket service; Gatekeeper
      # consults it online when a user runs a browser-downloaded copy. Bare
      # executables in a tarball cannot carry a stapled ticket, so acceptance
      # is recorded on Apple's side — the zip below exists only as the
      # submission envelope and is discarded. notarytool's exit code does not
      # reliably reflect the verdict, so acceptance is asserted from the
      # output — and the --wait poll stream itself can drop on a transient
      # network error after Apple has already accepted (v0.2.2 first run),
      # so a missing acceptance is re-read from the authoritative
      # `notarytool info` before the failure log is fetched and the step
      # declares failure.
      - name: Notarize the macOS payload
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ]; then
            echo "APPLE_ID secret is missing; the macOS release artifact must be notarized" >&2
            exit 1
          fi
          # One submission covers both payloads: notarization records each
          # Mach-O hash, so the receiver rides in the same envelope.
          mkdir -p "$RUNNER_TEMP/notarize-staging"
          cp -R out/ptk "$RUNNER_TEMP/notarize-staging/ptk"
          cp -R out/ptk-siem "$RUNNER_TEMP/notarize-staging/ptk-siem"
          ditto -c -k --keepParent "$RUNNER_TEMP/notarize-staging" "$RUNNER_TEMP/ptk-notarize.zip"
          SUBMIT_OUT=$(xcrun notarytool submit "$RUNNER_TEMP/ptk-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m 2>&1) || true
          echo "$SUBMIT_OUT"
          if ! echo "$SUBMIT_OUT" | grep -q 'status: Accepted'; then
            SUBMISSION_ID=$(echo "$SUBMIT_OUT" | awk '/^  id: / {print $2; exit}')
            INFO_OUT=''
            if [ -n "$SUBMISSION_ID" ]; then
              INFO_OUT=$(xcrun notarytool info "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1) || true
              echo "$INFO_OUT"
            fi
            if ! echo "$INFO_OUT" | grep -q 'status: Accepted'; then
              if [ -n "$SUBMISSION_ID" ]; then
                xcrun notarytool log "$SUBMISSION_ID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
              fi
              echo "notarization was not accepted" >&2
              exit 1
            fi
          fi

      - name: Archive
        id: archive
        shell: pwsh
        run: |
          $name = "ptk-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          if ('${{ matrix.archive }}' -eq 'zip') {
            $file = "dist/$name.zip"
            Compress-Archive -Path out/ptk/* -DestinationPath $file
          } else {
            $file = "dist/$name.tar.gz"
            tar -czf $file -C out/ptk .
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256"
          "file=$file" >> $env:GITHUB_OUTPUT
          Write-Host "$hash  $(Split-Path $file -Leaf)"

          # The receiver is its own artifact: a separately installed product
          # for environments without a SIEM (audit-restoration R6).
          $siemName = "ptk-siem-receiver-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          if ('${{ matrix.archive }}' -eq 'zip') {
            $siemFile = "dist/$siemName.zip"
            Compress-Archive -Path out/ptk-siem/* -DestinationPath $siemFile
          } else {
            $siemFile = "dist/$siemName.tar.gz"
            tar -czf $siemFile -C out/ptk-siem .
            if ($LASTEXITCODE -ne 0) { throw 'receiver tar failed' }
          }
          $siemHash = (Get-FileHash $siemFile -Algorithm SHA256).Hash.ToLowerInvariant()
          "$siemHash  $(Split-Path $siemFile -Leaf)" | Set-Content "$siemFile.sha256"
          Write-Host "$siemHash  $(Split-Path $siemFile -Leaf)"

      - uses: actions/upload-artifact@v4
        with:
          name: ptk-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          path: staged
          merge-multiple: true

      - name: Collect checksums
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          # Five RIDs, two artifacts each (server + SIEM receiver, R6); a
          # missing artifact means a runner failed and the draft would
          # silently ship short.
          count=$(ls -1 ptk-*.zip ptk-*.tar.gz 2>/dev/null | wc -l)
          if [ "$count" -ne 10 ]; then
            echo "expected 10 artifacts, found $count" >&2
            ls -la >&2
            exit 1
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.ref_name }}"
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      # Draft only. Publishing this release is an owner action and is
      # deliberately not automated.
      - name: Assemble draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ steps.version.outputs.version }}"
          fi
          gh release create "$tag" \
            --draft \
            --title "ptk ${{ steps.version.outputs.version }}" \
            --notes "Draft build for ${{ steps.version.outputs.version }}. Every asset was built and smoke-tested on its own native runner. Verify downloads against SHA256SUMS." \
            staged/* \
            || gh release upload "$tag" staged/* --clobber
