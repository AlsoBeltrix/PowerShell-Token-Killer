name: Release

# Tag-triggered. Builds one artifact per RID on that RID's own native runner
# and assembles a DRAFT release. Publishing is a separate owner action: this
# workflow never publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0-rc.1) when running manually'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each RID builds on matching hardware: PtkWorkerBroker is native and
          # the layout generator refuses cross-RID builds.
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: win-arm64
            os: windows-11-arm
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar
          - rid: osx-arm64
            os: macos-latest
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'
          } else {
            '${{ github.ref_name }}'
          }
          # install.ps1 strips a leading v; keep the tag shape out of the
          # artifact name too.
          $version = $version -replace '^[vV]', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version for ${{ matrix.rid }}"

      # RTK is a required dependency, so the packaged server cannot even start
      # without it and the handshake below would fail. win-arm64 has no
      # upstream aarch64 build and runs the x64 binary under emulation.
      - name: Install RTK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $HOME '.local/bin'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          $asset = switch ('${{ matrix.rid }}') {
            'win-x64'     { 'rtk-x86_64-pc-windows-msvc.zip' }
            'win-arm64'   { 'rtk-x86_64-pc-windows-msvc.zip' }
            'linux-x64'   { 'rtk-x86_64-unknown-linux-musl.tar.gz' }
            'linux-arm64' { 'rtk-aarch64-unknown-linux-gnu.tar.gz' }
            'osx-arm64'   { 'rtk-aarch64-apple-darwin.tar.gz' }
          }
          $url = "https://github.com/rtk-ai/rtk/releases/latest/download/$asset"
          $download = Join-Path ([IO.Path]::GetTempPath()) $asset
          Invoke-WebRequest -Uri $url -OutFile $download
          if ($asset.EndsWith('.zip')) {
            Expand-Archive -Path $download -DestinationPath $dest -Force
          } else {
            tar -xzf $download -C $dest
            if ($LASTEXITCODE -ne 0) { throw "tar failed for $asset" }
          }
          $dest >> $env:GITHUB_PATH

      # A version banner only proves the loader started the image. PTK depends
      # on the rewriter answering, which is what actually has to work under
      # win-arm64 emulation.
      - name: Verify RTK answers hook check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rtk --version
          $rewritten = rtk hook check --agent ptk 'git status --short' 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($rewritten)) {
            throw "rtk hook check did not answer on ${{ matrix.rid }} (exit $LASTEXITCODE)"
          }
          Write-Host "rtk rewrote to: $rewritten"

      - name: Build layout
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/install.ps1 `
            -LayoutOnly `
            -OutputDir out/ptk `
            -Rid ${{ matrix.rid }} `
            -Version ${{ steps.version.outputs.version }}

      # Every Mach-O in the payload is Developer ID-signed with hardened
      # runtime BEFORE any gate runs, so the smoke test and product proof
      # below exercise the exact signed bits that ship — including that the
      # entitlements keep the JITting .NET runtime alive under hardening.
      # The identity lives only in a throwaway keychain; Apple's G2
      # intermediate is imported alongside it because codesign refuses an
      # identity whose chain cannot validate (the exact failure first hit on
      # the dev machine).
      - name: Sign the macOS payload
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "MACOS_CERT_P12_BASE64 secret is missing; macOS release artifacts must be signed" >&2
            exit 1
          fi
          KC="$RUNNER_TEMP/ptk-sign.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          curl -sSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | awk 'NR==1 {print $2}')
          if [ -z "$IDENTITY" ]; then
            echo "no valid signing identity found in the imported certificate" >&2
            exit 1
          fi
          find out/ptk/bin -type f -print0 | while IFS= read -r -d '' f; do
            t=$(file -b "$f")
            case "$t" in
              *Mach-O*executable*)
                codesign --force --sign "$IDENTITY" --timestamp --options runtime \
                  --entitlements server/macos-signing-entitlements.plist "$f" ;;
              *Mach-O*)
                codesign --force --sign "$IDENTITY" --timestamp --options runtime "$f" ;;
            esac
          done
          codesign --verify --strict -v out/ptk/bin/PtkMcpServer
          codesign -dv out/ptk/bin/PtkMcpServer 2>&1 | grep "Developer ID Application"

      - name: Smoke-test the packaged server
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.rid }}'.StartsWith('win-')) {
            'out/ptk/bin/PtkMcpServer.exe'
          } else {
            'out/ptk/bin/PtkMcpServer'
          }
          if (-not $IsWindows) { chmod +x $exe }
          pwsh -NoProfile -File server/test-handshake.ps1 -ServerCommand (Resolve-Path $exe)

      # The handshake proves the transport; this proves the product contract
      # on the exact bits being archived. Slice 7.5 previously required a
      # hand-run pass on one clean host per RID, which meant five machines
      # and a manual checklist. Every RID already builds on its own native
      # runner here, so run the gate where the artifact is made: a release
      # cannot now be drafted from an artifact that fails its own contract.
      #
      # Not the uninstall check: -UninstallHome needs an installed home, and
      # this stage has a layout rather than an install. That leg stays with
      # the operator's per-host pass.
      - name: Prove the product contract on the packaged bits
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.rid }}'.StartsWith('win-')) {
            'out/ptk/bin/PtkMcpServer.exe'
          } else {
            'out/ptk/bin/PtkMcpServer'
          }
          pwsh -NoProfile -File server/direct-product-proof.ps1 `
            -ServerPath (Resolve-Path $exe)

      # The startup gate is a product contract: no RTK means a clear refusal,
      # never a half-working server. Proven against the packaged bits.
      - name: Prove the RTK startup gate
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.rid }}'.StartsWith('win-')) {
            'out/ptk/bin/PtkMcpServer.exe'
          } else {
            'out/ptk/bin/PtkMcpServer'
          }
          # The child needs a genuinely empty environment block. Start-Process
          # -Environment MERGES into the inherited one, so the real PATH
          # survives and the server legitimately finds rtk — a gate that can
          # never fail is not a gate. Clear the block explicitly instead.
          $psi = [Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Resolve-Path $exe)
          $psi.UseShellExecute = $false
          $psi.RedirectStandardError = $true
          $psi.EnvironmentVariables.Clear()
          if ($IsWindows) {
            # Without SystemRoot the loader cannot resolve system DLLs and the
            # process dies before reaching PTK's own startup check.
            $psi.EnvironmentVariables['SystemRoot'] = $env:SystemRoot
          }
          $p = [Diagnostics.Process]::Start($psi)
          $text = $p.StandardError.ReadToEnd()
          if (-not $p.WaitForExit(60000)) {
            $p.Kill($true)
            throw "server did not exit without RTK; it must refuse to start. stderr: $text"
          }
          if ($p.ExitCode -ne 78) {
            throw "expected exit 78 without RTK, got $($p.ExitCode). stderr: $text"
          }
          if ($text -notmatch 'PTK_RTK_PATH') {
            throw "refusal message did not name PTK_RTK_PATH. stderr: $text"
          }
          Write-Host "Startup gate ok: exit 78, message names PTK_RTK_PATH"

      # Notarization is Apple's malware-scan-and-ticket service; Gatekeeper
      # consults it online when a user runs a browser-downloaded copy. Bare
      # executables in a tarball cannot carry a stapled ticket, so acceptance
      # is recorded on Apple's side — the zip below exists only as the
      # submission envelope and is discarded. notarytool's exit code does not
      # reliably reflect the verdict, so acceptance is asserted from the
      # output and the failure log is fetched when it is anything else.
      - name: Notarize the macOS payload
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_ID" ]; then
            echo "APPLE_ID secret is missing; the macOS release artifact must be notarized" >&2
            exit 1
          fi
          ditto -c -k --keepParent out/ptk "$RUNNER_TEMP/ptk-notarize.zip"
          SUBMIT_OUT=$(xcrun notarytool submit "$RUNNER_TEMP/ptk-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m 2>&1) || true
          echo "$SUBMIT_OUT"
          if ! echo "$SUBMIT_OUT" | grep -q 'status: Accepted'; then
            SUBMISSION_ID=$(echo "$SUBMIT_OUT" | awk '/^  id: / {print $2; exit}')
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            echo "notarization was not accepted" >&2
            exit 1
          fi

      - name: Archive
        id: archive
        shell: pwsh
        run: |
          $name = "ptk-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          if ('${{ matrix.archive }}' -eq 'zip') {
            $file = "dist/$name.zip"
            Compress-Archive -Path out/ptk/* -DestinationPath $file
          } else {
            $file = "dist/$name.tar.gz"
            tar -czf $file -C out/ptk .
            if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
          }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256"
          "file=$file" >> $env:GITHUB_OUTPUT
          Write-Host "$hash  $(Split-Path $file -Leaf)"

      - uses: actions/upload-artifact@v4
        with:
          name: ptk-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          path: staged
          merge-multiple: true

      - name: Collect checksums
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          # Five RIDs must all be present; a missing artifact means a runner
          # failed and the draft would silently ship short.
          count=$(ls -1 ptk-*.zip ptk-*.tar.gz 2>/dev/null | wc -l)
          if [ "$count" -ne 5 ]; then
            echo "expected 5 artifacts, found $count" >&2
            ls -la >&2
            exit 1
          fi

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.ref_name }}"
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      # Draft only. Publishing this release is an owner action and is
      # deliberately not automated.
      - name: Assemble draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ steps.version.outputs.version }}"
          fi
          gh release create "$tag" \
            --draft \
            --title "ptk ${{ steps.version.outputs.version }}" \
            --notes "Draft build for ${{ steps.version.outputs.version }}. Every asset was built and smoke-tested on its own native runner. Verify downloads against SHA256SUMS." \
            staged/* \
            || gh release upload "$tag" staged/* --clobber
